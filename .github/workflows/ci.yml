name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          cmake ninja-build libx11-dev libxrandr-dev libxcursor-dev libxi-dev
          libudev-dev libfreetype-dev libgl1-mesa-dev xvfb zenity appstream
      - run: appstreamcli validate --no-net packaging/linux/is.magnusp.pfbstudio.appdata.xml
      - run: cmake --preset release-linux
      - run: cmake --build --preset release-linux
      - run: ctest --preset release-linux
      - run: xvfb-run -a ./build/release-linux/pfb-studio --smoke-test build/smoke

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64
      - run: cmake -S . -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build/windows
      - run: ctest --test-dir build/windows --output-on-failure
      - name: Stress-test Windows GUI startup
        shell: pwsh
        run: |
          for ($i = 1; $i -le 10; $i++) {
            $p = Start-Process ./build/windows/PFBStudio.exe -PassThru
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) {
              $code = $p.ExitCode -band 0xffffffff
              throw ("PFBStudio.exe launch {0} exited with 0x{1:X8}" -f $i, $code)
            }
            Stop-Process -Id $p.Id -Force
            $p.WaitForExit()
          }
      - name: Launch version smoke check
        shell: pwsh
        run: |
          $p = Start-Process ./build/windows/PFBStudio.exe -ArgumentList '--version' -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            $code = $p.ExitCode -band 0xffffffff
            throw ("PFBStudio.exe --version exited with 0x{0:X8}" -f $code)
          }
      - name: Verify single executable output
        shell: pwsh
        run: |
          if (!(Test-Path build/windows/PFBStudio.exe)) { throw "PFBStudio.exe was not built" }
          Get-Item build/windows/PFBStudio.exe | Format-List Name,Length,VersionInfo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PFBStudio-baseline-profiler-windows-fixed
          path: build/windows/PFBStudio.exe
