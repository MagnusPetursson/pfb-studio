name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          cmake ninja-build libx11-dev libxrandr-dev libxcursor-dev libxi-dev
          libudev-dev libfreetype-dev libgl1-mesa-dev xvfb zenity appstream
      - run: appstreamcli validate --no-net packaging/linux/is.magnusp.pfbstudio.appdata.xml
      - run: cmake --preset release-linux
      - run: cmake --build --preset release-linux
      - run: ctest --preset release-linux
      - run: xvfb-run -a ./build/release-linux/pfb-studio --smoke-test build/smoke
      - name: Build DEB
        run: cpack --config build/release-linux/CPackConfig.cmake -G DEB -B dist
      - run: dpkg-deb --contents dist/*.deb
      - name: Build AppImage
        run: |
          curl -fL https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -o linuxdeploy-x86_64.AppImage
          echo "e87ee0815d109282fdda73e34c2361d64d02b0ffaea3674b18f1fd1f6a687dcf  linuxdeploy-x86_64.AppImage" | sha256sum -c -
          chmod +x linuxdeploy-x86_64.AppImage packaging/linux/build-appimage.sh
          LINUXDEPLOY="$PWD/linuxdeploy-x86_64.AppImage" packaging/linux/build-appimage.sh build/release-linux dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-release
          path: |
            dist/*.deb
            dist/*.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64
      - run: cmake -S . -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - run: cmake --build build/windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: build/windows/PFBStudio.exe

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          cd dist
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: true
          generate_release_notes: true
          files: dist/*
