name: Experimental studies

on:
  push:
    paths: ['experiments/**', '.github/workflows/experiments.yml']
  pull_request:
    paths: ['experiments/**', '.github/workflows/experiments.yml']

jobs:
  python-studies:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/requirements.txt
      - run: python -m pip install -r experiments/requirements.txt
      - run: python -m unittest discover -s experiments/tests -v
      - run: python -m experiments.render --study all --seeds 1 --size 256 --jobs 2 --output build/study-smoke
