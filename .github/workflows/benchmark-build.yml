name: Benchmark Build

on:
  push:
    branches:
      - agent/optimize-rendering-hotpaths
    paths:
      - '.github/workflows/benchmark-build.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64
      - run: cmake -S . -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - run: cmake --build build/windows
      - name: Write build info
        shell: pwsh
        run: |
          "Branch: $env:GITHUB_REF_NAME" | Out-File build/windows/BUILD-INFO.txt
          "Commit: $env:GITHUB_SHA" | Out-File build/windows/BUILD-INFO.txt -Append
          "Configuration: Release / MSVC x64" | Out-File build/windows/BUILD-INFO.txt -Append
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PFBStudio-optimized-benchmark-windows
          path: |
            build/windows/PFBStudio.exe
            build/windows/BUILD-INFO.txt

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          cmake ninja-build libx11-dev libxrandr-dev libxcursor-dev libxi-dev
          libudev-dev libfreetype-dev libgl1-mesa-dev xvfb zenity appstream
      - run: cmake --preset release-linux
      - run: cmake --build --preset release-linux
      - name: Build DEB
        run: cpack --config build/release-linux/CPackConfig.cmake -G DEB -B dist
      - name: Build AppImage
        run: |
          curl -fL https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -o linuxdeploy-x86_64.AppImage
          echo "e87ee0815d109282fdda73e34c2361d64d02b0ffaea3674b18f1fd1f6a687dcf  linuxdeploy-x86_64.AppImage" | sha256sum -c -
          chmod +x linuxdeploy-x86_64.AppImage packaging/linux/build-appimage.sh
          LINUXDEPLOY="$PWD/linuxdeploy-x86_64.AppImage" packaging/linux/build-appimage.sh build/release-linux dist
      - name: Write build info
        run: |
          printf 'Branch: %s\nCommit: %s\nConfiguration: Release / GCC x64\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > dist/BUILD-INFO.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PFBStudio-optimized-benchmark-linux
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/BUILD-INFO.txt
